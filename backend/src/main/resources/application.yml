spring:
  application:
    name: taskflow-backend
  config:
    # Allows a local backend/.env file (KEY=value) to be used for development.
    # Real environment variables always take precedence.
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Override in every non-local environment (openssl rand -base64 48).
    secret: ${JWT_SECRET:change-me-dev-only-secret-change-me-dev-only-secret}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    # Set COOKIE_SECURE=true in production so the refresh cookie is TLS-only.
    cookie-secure: ${COOKIE_SECURE:false}
  seed:
    enabled: ${SEED_DATA_ENABLED:true}
    # Development-only credentials. Clearly non-production, never used to protect real data.
    admin-email: ${SEED_ADMIN_EMAIL:admin@taskflow.local}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin123!}
    manager-email: ${SEED_MANAGER_EMAIL:manager@taskflow.local}
    manager-password: ${SEED_MANAGER_PASSWORD:Manager123!}
    member-email: ${SEED_MEMBER_EMAIL:member@taskflow.local}
    member-password: ${SEED_MEMBER_PASSWORD:Member123!}

logging:
  level:
    com.taskflow: INFO
